# Publishes the static export in `out/` to GitHub Pages, served at
# https://www.watch-list.me (the custom domain is set in Settings → Pages, not by
# a CNAME file: a Pages deployment from Actions takes it from there).
#
# Runs only after CI has passed on a push to main, so nothing reaches the site
# that failed lint, typecheck or the test suite. `workflow_dispatch` is there for
# redeploying by hand – after rotating the TMDB token, say.
#
# And once a day on a schedule, with no change at all: the genre, mood and home
# pages carry a snapshot of TMDB taken at build time (`src/lib/build-time-tmdb.ts`),
# and a snapshot only stays current by being taken again. A scheduled run
# rebuilds whatever main points at, and only once CI has passed on exactly that
# commit (see `latest`). GitHub pauses schedules in a repository with no
# activity for sixty days; a push or a manual run starts them again.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      # For the first run, or after a change to what the pages contain: tell
      # IndexNow about every URL in the sitemap, not only the ones this deploy
      # added or removed (see `scripts/indexnow.mjs`).
      indexnow_all:
        description: "Submit every sitemap URL to IndexNow, not only the new ones"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

# Read-only for every job unless it says otherwise. Only `deploy` can publish:
# `build` runs `npm ci`, which runs the install scripts of every dependency, and
# those should not hold a token that can mint OIDC credentials or write to Pages.
permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: a half-published site
# is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Re-running an old CI run – to retry a flaky test, say – completes CI again
  # for that run's commit, and this workflow would then build and publish it:
  # a silent rollback to whatever main looked like back then. So a CI-triggered
  # deployment goes ahead only for the commit main points at now. A commit that
  # is no longer the tip is not lost by this: the newer one deploys when its own
  # CI passes. A manual dispatch deploys what it was dispatched on, as before.
  #
  # A scheduled run has no CI run of its own behind it, so it asks: main's tip
  # deploys only if a CI run on a push of exactly that commit succeeded. Without
  # that, a push whose CI failed would reach the site at the next scheduled run.
  # The commit chosen here is the one `build` checks out.
  latest:
    # `event == 'push'` as well as the branch filter above: a fork's pull request
    # from a branch that happens to be called `main` passes that filter too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # `actions: read` for the scheduled run's question about CI; the rest of the
    # workflow keeps the read-only default above.
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
      sha: ${{ steps.tip.outputs.sha }}

    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$EVENT" = "schedule" ]; then
            passed="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tip&event=push&status=success&per_page=1" --jq .total_count)"
            if [ "$passed" -gt 0 ]; then
              echo "sha=$tip" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Not rebuilding $tip: no successful CI run on a push of that commit."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $HEAD_SHA: main is at $tip now, and that commit deploys after its own CI run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      # Before anything is installed or built. Every `NEXT_PUBLIC_` variable is
      # inlined into the client bundle and the pages call TMDB from the browser
      # with this one, so a build without it deploys fine and then answers 401
      # to everything. A missing or misnamed secret has to stop the deploy, not
      # ship that. Tested for emptiness only – never printed.
      - name: Require the TMDB token
        env:
          NEXT_PUBLIC_TMDB_API_TOKEN: ${{ secrets.NEXT_PUBLIC_TMDB_API_TOKEN }}
        run: |
          if [ -z "$NEXT_PUBLIC_TMDB_API_TOKEN" ]; then
            echo "::error::The NEXT_PUBLIC_TMDB_API_TOKEN secret is missing or empty. A build without it would publish a site that answers 401 to every TMDB request. Set it under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The commit `latest` chose: the one CI actually tested, not whatever
          # main points at by now. (The two are the same for a CI-triggered or
          # scheduled run, but this is the one that was tested, so it is the
          # one to name.)
          ref: ${{ needs.latest.outputs.sha }}
          # Nothing after this runs git, and `npm ci` runs other people's code.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Unlike CI, this build needs the token (see the first step) – the browser
      # calls TMDB with it, and so does the build, for the snapshots it writes
      # into the genre, mood and home pages. A TMDB failure while taking them
      # fails the build, and the deployment already live stays live. The token
      # is public in the shipped JS either way – the secret only keeps it out of
      # the repository.
      #
      # The GA id is public too (it is in every page's markup), so a repository
      # variable is the natural home for it – but it is read from either kind,
      # because the two sit side by side in Settings and one read from the wrong
      # one is an empty string: a site that builds, deploys and silently reports
      # nothing.
      - run: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_TOKEN: ${{ secrets.NEXT_PUBLIC_TMDB_API_TOKEN }}
          NEXT_PUBLIC_BASE_URL: https://www.watch-list.me
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      # Before the deploy, on purpose: the live site still serves the previous
      # sitemap, and what the new one lists beyond it is what this deploy adds.
      # The list waits in an artifact until the pages can actually be fetched.
      - name: List the URLs this deploy adds or removes
        env:
          ALL: ${{ inputs.indexnow_all && '--all' || '' }}
        run: node scripts/indexnow.mjs diff https://www.watch-list.me/sitemap.xml out/sitemap.xml indexnow-urls.txt $ALL

      - uses: actions/upload-artifact@v7
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          retention-days: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can publish, and the only one that runs nothing but
    # GitHub's own action.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After the deploy, so nothing is announced before it can be fetched. Its own
  # job: `deploy` stays the one that runs nothing but GitHub's action, and a
  # refused submission is a warning on this run rather than a failed deploy –
  # the site is live either way, and the sitemap says everything this would.
  indexnow:
    needs: [latest, deploy]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.latest.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        with:
          name: indexnow-urls

      - run: node scripts/indexnow.mjs submit indexnow-urls.txt
